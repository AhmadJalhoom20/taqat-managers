
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق المكالمات الصوتية والمرئية</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .back{
            position: fixed;
            top: 15px;
            right: 15px;

        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }

        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(31, 38, 135, 0.37);
            border: 1px solid rgba(255, 255, 255, 0.18);
            max-width: 600px;
            width: 90%;
            text-align: center;
        }

        h1 {
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .screen {
            display: none;
        }

        .screen.active {
            display: block;
        }

        .call-type-selector {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
            justify-content: center;
        }

        .call-type-btn {
            flex: 1;
            padding: 20px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 15px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1.1em;
        }

        .call-type-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        .call-type-btn.selected {
            background: linear-gradient(45deg, #FF6B6B, #4ECDC4);
            border-color: white;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            font-size: 1.1em;
        }

        input[type="text"], select {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            font-size: 1.2em;
            text-align: center;
            background: rgba(255, 255, 255, 0.9);
            color: #333;
            outline: none;
            transition: all 0.3s ease;
        }

        input[type="text"]:focus, select:focus {
            background: white;
            transform: scale(1.05);
        }

        select {
            text-align-last: center;
        }

        button {
            background: linear-gradient(45deg, #FF6B6B, #4ECDC4);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 50px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            margin: 10px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(0,0,0,0.3);
        }

        button:active {
            transform: translateY(0);
        }

        .btn-danger {
            background: linear-gradient(45deg, #FF416C, #FF4B2B);
        }

        .btn-success {
            background: linear-gradient(45deg, #56AB2F, #A8E6CF);
        }

        .call-info {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 15px;
            padding: 20px;
            margin: 20px 0;
        }

        .room-number {
            font-size: 2em;
            font-weight: bold;
            color: #FFD700;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            margin: 10px 0;
        }

        .status {
            font-size: 1.2em;
            margin: 15px 0;
            padding: 10px;
            border-radius: 10px;
            font-weight: bold;
        }

        .status.waiting {
            background: rgba(255, 193, 7, 0.3);
            color: #FFD700;
        }

        .status.connected {
            background: rgba(40, 167, 69, 0.3);
            color: #28A745;
        }

        .status.error {
            background: rgba(220, 53, 69, 0.3);
            color: #DC3545;
        }

        .media-controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 20px 0;
            flex-wrap: wrap;
        }

        .control-btn {
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid white;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5em;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .control-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .control-btn.active {
            background: rgba(220, 53, 69, 0.8);
        }

        .video-container {
            display: flex;
            gap: 20px;
            margin: 20px 0;
            justify-content: center;
            flex-wrap: wrap;
        }

        .video-wrapper {
            position: relative;
            border-radius: 15px;
            overflow: hidden;
            background: rgba(0, 0, 0, 0.3);
        }

        video {
            width: 200px;
            height: 150px;
            object-fit: cover;
            border-radius: 15px;
        }

        .video-label {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 0.9em;
        }

        .call-type-indicator {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: rgba(255, 255, 255, 0.2);
            padding: 10px 20px;
            border-radius: 25px;
            margin-bottom: 20px;
        }

        .device-selector {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .error-message {
            background: rgba(220, 53, 69, 0.8);
            color: white;
            padding: 10px;
            border-radius: 10px;
            margin: 10px 0;
            display: none;
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
                margin: 20px;
            }
            
            h1 {
                font-size: 2em;
            }
            
            .call-type-selector {
                flex-direction: column;
                gap: 10px;
            }
            
            video {
                width: 150px;
                height: 112px;
            }
            
            .media-controls {
                gap: 10px;
            }
            
            .control-btn {
                width: 50px;
                height: 50px;
                font-size: 1.2em;
            }
        }
    </style>
</head>
<body>
    
    <div class="container">
        
        <h1>📞📹 مكالمات صوتية ومرئية</h1>

        <!-- شاشة البداية -->
        <div id="homeScreen" class="screen active">
            <div class="call-type-selector">
                <div class="call-type-btn" onclick="selectCallType('audio')">
                    🎤<br>مكالمة صوتية
                </div>
                <div class="call-type-btn" onclick="selectCallType('video')">
                    📹<br>مكالمة فيديو
                </div>
            </div>
            
            <div id="callTypeSelected" style="display: none;">
                <div class="call-type-indicator">
                    <span id="selectedTypeIcon">🎤</span>
                    <span id="selectedTypeText">مكالمة صوتية</span>
                </div>
                
                <div class="device-selector">
                    <div class="form-group">
                        <label for="microphoneSelect">اختر المايك:</label>
                        <select id="microphoneSelect">
                            <option value="">جاري تحميل الأجهزة...</option>
                        </select>
                    </div>
                    <div id="cameraSelector" class="form-group" style="display: none;">
                        <label for="cameraSelect">اختر الكاميرا:</label>
                        <select id="cameraSelect">
                            <option value="">جاري تحميل الكاميرات...</option>
                        </select>
                    </div>
                </div>
                
                <button onclick="showCreateRoom()">إنشاء غرفة جديدة</button>
                <button onclick="showJoinRoom()">الانضمام لغرفة</button>
                <button onclick="resetSelection()">تغيير نوع المكالمة</button>
            </div>
        </div>

        <!-- شاشة إنشاء غرفة -->
        <div id="createScreen" class="screen">
            <div class="call-type-indicator">
                <span id="createTypeIcon">🎤</span>
                <span id="createTypeText">إنشاء غرفة - مكالمة صوتية</span>
            </div>
            <button onclick="createRoom()" class="btn-success">إنشاء غرفة</button>
            <button onclick="showHome()">العودة</button>
        </div>

        <!-- شاشة الانضمام لغرفة -->
        <div id="joinScreen" class="screen">
            <div class="call-type-indicator">
                <span id="joinTypeIcon">🎤</span>
                <span id="joinTypeText">الانضمام - مكالمة صوتية</span>
            </div>
            <div class="form-group">
                <label for="roomInput">رقم الغرفة (4 أرقام):</label>
                <input type="text" id="roomInput" maxlength="4" placeholder="مثال: 1234">
            </div>
            <button onclick="joinRoom()" class="btn-success">انضمام</button>
            <button onclick="showHome()">العودة</button>
        </div>

        <!-- شاشة المكالمة -->
        <div id="callScreen" class="screen">
            <div class="call-info">
                <div class="call-type-indicator">
                    <span id="callTypeIcon">🎤</span>
                    <span id="callTypeText">مكالمة صوتية</span>
                </div>
                <div>رقم الغرفة:</div>
                <div class="room-number" id="currentRoom"></div>
                <div class="status" id="callStatus">جاري الاتصال...</div>
            </div>

            <!-- منطقة الفيديو -->
            <div id="videoContainer" class="video-container" style="display: none;">
                <div class="video-wrapper">
                    <video id="localVideo" autoplay muted playsinline></video>
                    <div class="video-label">أنا</div>
                </div>
                <div class="video-wrapper">
                    <video id="remoteVideo" autoplay playsinline></video>
                    <div class="video-label">الطرف الآخر</div>
                </div>
            </div>

            <!-- أزرار التحكم -->
            <div class="media-controls">
                <button class="control-btn" id="muteBtn" onclick="toggleMute()" title="كتم الصوت">
                    🎤
                </button>
                <button class="control-btn" id="videoBtn" onclick="toggleVideo()" title="إيقاف الكاميرا" style="display: none;">
                    📹
                </button>
            </div>

            <button onclick="endCall()" class="btn-danger">إنهاء المكالمة</button>
        </div>

        <div class="error-message" id="errorMessage"></div>
    </div>
    <a href="index.html"><button class="back">عد ل الموقع الرئيسي</button></a>

    <!-- Firebase SDK -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/9.22.2/firebase-app-compat.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/9.22.2/firebase-firestore-compat.min.js"></script>

    <script>
  const firebaseConfig = {
  apiKey: "AIzaSyAxJhggkIYf6Wb3KrA5CrDlUxmvu2wGNmY",
  authDomain: "vido-c12f8.firebaseapp.com",
  databaseURL: "https://vido-c12f8-default-rtdb.firebaseio.com",
  projectId: "vido-c12f8",
  storageBucket: "vido-c12f8.firebasestorage.app",
  messagingSenderId: "175531002318",
  appId: "1:175531002318:web:5dd0612b5e6dd89c11439f"
};

        // تهيئة Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // متغيرات عامة
        let localStream;
        let remoteStream;
        let peerConnection;
        let currentRoomId;
        let isMuted = false;
        let isVideoOff = false;
        let isCreator = false;
        let callType = null; // 'audio' أو 'video'
        let selectedMicId = null;
        let selectedCameraId = null;

        // إعدادات WebRTC
        const servers = {
            iceServers: [
                {
                    urls: ['stun:stun1.l.google.com:19302', 'stun:stun2.l.google.com:19302'],
                },
            ],
            iceCandidatePoolSize: 10,
        };

        // تحميل قائمة الأجهزة
        async function loadDevices() {
            try {
                const devices = await navigator.mediaDevices.enumerateDevices();
                const micSelect = document.getElementById('microphoneSelect');
                const cameraSelect = document.getElementById('cameraSelect');
                
                // مسح الخيارات السابقة
                micSelect.innerHTML = '<option value="">المايك الافتراضي</option>';
                cameraSelect.innerHTML = '<option value="">الكاميرا الافتراضية</option>';
                
                devices.forEach(device => {
                    const option = document.createElement('option');
                    option.value = device.deviceId;
                    
                    if (device.kind === 'audioinput') {
                        option.textContent = device.label || `مايك ${micSelect.children.length}`;
                        micSelect.appendChild(option);
                    } else if (device.kind === 'videoinput') {
                        option.textContent = device.label || `كاميرا ${cameraSelect.children.length}`;
                        cameraSelect.appendChild(option);
                    }
                });
            } catch (error) {
                console.error('خطأ في تحميل الأجهزة:', error);
            }
        }

        // اختيار نوع المكالمة
        function selectCallType(type) {
            callType = type;
            
            // تحديث الأزرار
            document.querySelectorAll('.call-type-btn').forEach(btn => {
                btn.classList.remove('selected');
            });
            event.target.classList.add('selected');
            
            // تحديث النصوص والأيقونات
            const icon = type === 'audio' ? '🎤' : '📹';
            const text = type === 'audio' ? 'مكالمة صوتية' : 'مكالمة فيديو';
            
            document.getElementById('selectedTypeIcon').textContent = icon;
            document.getElementById('selectedTypeText').textContent = text;
            document.getElementById('createTypeIcon').textContent = icon;
            document.getElementById('createTypeText').textContent = `إنشاء غرفة - ${text}`;
            document.getElementById('joinTypeIcon').textContent = icon;
            document.getElementById('joinTypeText').textContent = `الانضمام - ${text}`;
            
            // إظهار/إخفاء خيارات الكاميرا
            const cameraSelector = document.getElementById('cameraSelector');
            if (type === 'video') {
                cameraSelector.style.display = 'block';
            } else {
                cameraSelector.style.display = 'none';
            }
            
            // تحميل الأجهزة وإظهار الخيارات
            loadDevices();
            document.getElementById('callTypeSelected').style.display = 'block';
        }

        // إعادة تعيين الاختيار
        function resetSelection() {
            callType = null;
            document.getElementById('callTypeSelected').style.display = 'none';
            document.querySelectorAll('.call-type-btn').forEach(btn => {
                btn.classList.remove('selected');
            });
        }

        // وظائف التنقل بين الشاشات
        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(screen => {
                screen.classList.remove('active');
            });
            document.getElementById(screenId).classList.add('active');
        }

        function showHome() {
            showScreen('homeScreen');
            if (peerConnection) {
                endCall();
            }
        }

        function showCreateRoom() {
            if (!callType) {
                showError('يرجى اختيار نوع المكالمة أولاً');
                return;
            }
            showScreen('createScreen');
        }

        function showJoinRoom() {
            if (!callType) {
                showError('يرجى اختيار نوع المكالمة أولاً');
                return;
            }
            showScreen('joinScreen');
        }

        // إنشاء رقم غرفة عشوائي
        function generateRoomId() {
            return Math.floor(1000 + Math.random() * 9000).toString();
        }

        // عرض رسالة خطأ
        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
            setTimeout(() => {
                errorDiv.style.display = 'none';
            }, 5000);
        }

        // تحديث حالة المكالمة
        function updateStatus(message, type = 'waiting') {
            const statusDiv = document.getElementById('callStatus');
            statusDiv.textContent = message;
            statusDiv.className = `status ${type}`;
        }

        // الحصول على الوسائط (صوت/فيديو)
        async function getLocalStream() {
            try {
                // الحصول على معرفات الأجهزة المختارة
                selectedMicId = document.getElementById('microphoneSelect').value;
                selectedCameraId = document.getElementById('cameraSelect').value;
                
                const constraints = {
                    audio: selectedMicId ? { deviceId: selectedMicId } : true,
                    video: callType === 'video' ? (selectedCameraId ? { deviceId: selectedCameraId } : true) : false
                };
                
                localStream = await navigator.mediaDevices.getUserMedia(constraints);
                
                // إذا كانت مكالمة فيديو، عرض الفيديو المحلي
                if (callType === 'video') {
                    const localVideo = document.getElementById('localVideo');
                    localVideo.srcObject = localStream;
                }
                
                return localStream;
            } catch (error) {
                console.error('خطأ في الحصول على الوسائط:', error);
                showError('لا يمكن الوصول للمايك أو الكاميرا. تأكد من السماح بالوصول.');
                throw error;
            }
        }

        // إنشاء اتصال WebRTC
        function createPeerConnection(roomId) {
            peerConnection = new RTCPeerConnection(servers);

            // إضافة الوسائط المحلية
            if (localStream) {
                localStream.getTracks().forEach(track => {
                    peerConnection.addTrack(track, localStream);
                });
            }

            // التعامل مع الوسائط البعيدة
            peerConnection.ontrack = event => {
                const [remoteStream] = event.streams;
                
                if (callType === 'video') {
                    const remoteVideo = document.getElementById('remoteVideo');
                    remoteVideo.srcObject = remoteStream;
                } else {
                    // للمكالمات الصوتية، تشغيل الصوت فقط
                    const audio = new Audio();
                    audio.srcObject = remoteStream;
                    audio.play();
                }
                
                updateStatus('متصل', 'connected');
            };

            // التعامل مع ice candidates
            peerConnection.onicecandidate = event => {
                if (event.candidate) {
                    db.collection('rooms').doc(roomId)
                        .collection(isCreator ? 'callerCandidates' : 'calleeCandidates')
                        .add(event.candidate.toJSON());
                }
            };

            // التعامل مع تغيير حالة الاتصال
            peerConnection.onconnectionstatechange = () => {
                console.log('Connection state:', peerConnection.connectionState);
                if (peerConnection.connectionState === 'disconnected' || 
                    peerConnection.connectionState === 'failed') {
                    updateStatus('انقطع الاتصال', 'error');
                    setTimeout(() => {
                        endCall();
                    }, 3000);
                }
            };

            return peerConnection;
        }

        // إنشاء غرفة جديدة
        async function createRoom() {
            try {
                updateStatus('جاري إنشاء الغرفة...', 'waiting');
                
                currentRoomId = generateRoomId();
                isCreator = true;

                // الحصول على الوسائط أولاً
                await getLocalStream();

                // إنشاء peer connection
                createPeerConnection(currentRoomId);

                // إنشاء offer
                const offer = await peerConnection.createOffer();
                await peerConnection.setLocalDescription(offer);

                // حفظ بيانات الغرفة في Firebase
                const roomRef = db.collection('rooms').doc(currentRoomId);
                await roomRef.set({
                    offer: {
                        type: offer.type,
                        sdp: offer.sdp,
                    },
                    callType: callType,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                });

                // إعداد شاشة المكالمة
                setupCallScreen();

                // الاستماع للإجابة
                roomRef.onSnapshot(async snapshot => {
                    const data = snapshot.data();
                    if (data?.answer && !peerConnection.currentRemoteDescription) {
                        const rtcSessionDescription = new RTCSessionDescription(data.answer);
                        await peerConnection.setRemoteDescription(rtcSessionDescription);
                    }
                });

                // الاستماع لـ ice candidates
                roomRef.collection('calleeCandidates').onSnapshot(snapshot => {
                    snapshot.docChanges().forEach(async change => {
                        if (change.type === 'added') {
                            const candidate = new RTCIceCandidate(change.doc.data());
                            await peerConnection.addIceCandidate(candidate);
                        }
                    });
                });

            } catch (error) {
                console.error('خطأ في إنشاء الغرفة:', error);
                showError('حدث خطأ في إنشاء الغرفة');
                showHome();
            }
        }

        // الانضمام لغرفة
        async function joinRoom() {
            const roomInput = document.getElementById('roomInput');
            const roomId = roomInput.value.trim();

            if (roomId.length !== 4 || !/^\d{4}$/.test(roomId)) {
                showError('يجب إدخال رقم غرفة مكون من 4 أرقام');
                return;
            }

            try {
                updateStatus('جاري الانضمام...', 'waiting');
                
                currentRoomId = roomId;
                isCreator = false;

                // التحقق من وجود الغرفة
                const roomRef = db.collection('rooms').doc(roomId);
                const roomSnapshot = await roomRef.get();

                if (!roomSnapshot.exists) {
                    showError('الغرفة غير موجودة');
                    return;
                }

                const roomData = roomSnapshot.data();
                
                // التحقق من تطابق نوع المكالمة
                if (roomData.callType !== callType) {
                    const roomTypeText = roomData.callType === 'audio' ? 'صوتية' : 'فيديو';
                    const currentTypeText = callType === 'audio' ? 'صوتية' : 'فيديو';
                    showError(`الغرفة للمكالمات ${roomTypeText} وأنت اخترت مكالمة ${currentTypeText}`);
                    return;
                }

                // الحصول على الوسائط
                await getLocalStream();

                // إنشاء peer connection
                createPeerConnection(roomId);

                // الحصول على الـ offer وإنشاء answer
                const offer = roomData.offer;
                await peerConnection.setRemoteDescription(new RTCSessionDescription(offer));

                const answer = await peerConnection.createAnswer();
                await peerConnection.setLocalDescription(answer);

                // حفظ الإجابة
                await roomRef.update({
                    answer: {
                        type: answer.type,
                        sdp: answer.sdp,
                    },
                });

                // إعداد شاشة المكالمة
                setupCallScreen();

                // الاستماع لـ ice candidates
                roomRef.collection('callerCandidates').onSnapshot(snapshot => {
                    snapshot.docChanges().forEach(async change => {
                        if (change.type === 'added') {
                            const candidate = new RTCIceCandidate(change.doc.data());
                            await peerConnection.addIceCandidate(candidate);
                        }
                    });
                });

            } catch (error) {
                console.error('خطأ في الانضمام للغرفة:', error);
                showError('حدث خطأ في الانضمام للغرفة');
                showHome();
            }
        }

        // إعداد شاشة المكالمة
        function setupCallScreen() {
            // تحديث معلومات المكالمة
            document.getElementById('currentRoom').textContent = currentRoomId;
            
            const icon = callType === 'audio' ? '🎤' : '📹';
            const text = callType === 'audio' ? 'مكالمة صوتية' : 'مكالمة فيديو';
            
            document.getElementById('callTypeIcon').textContent = icon;
            document.getElementById('callTypeText').textContent = text;
            
            // إظهار/إخفاء عناصر الفيديو
            const videoContainer = document.getElementById('videoContainer');
            const videoBtn = document.getElementById('videoBtn');
            
            if (callType === 'video') {
                videoContainer.style.display = 'flex';
                videoBtn.style.display = 'flex';
            } else {
                videoContainer.style.display = 'none';
                videoBtn.style.display = 'none';
            }
            
            // عرض شاشة المكالمة
            showScreen('callScreen');
            updateStatus('في انتظار الطرف الآخر...', 'waiting');
        }

        // كتم/إلغاء كتم الصوت
        function toggleMute() {
            if (!localStream) return;

            const audioTracks = localStream.getAudioTracks();
            const muteBtn = document.getElementById('muteBtn');

            if (audioTracks.length > 0) {
                isMuted = !isMuted;
                audioTracks[0].enabled = !isMuted;
                
                if (isMuted) {
                    muteBtn.textContent = '🔇';
                    muteBtn.classList.add('active');
                } else {
                    muteBtn.textContent = '🎤';
                    muteBtn.classList.remove('active');
                }
            }
        }

        // إيقاف/تشغيل الفيديو
        function toggleVideo() {
            if (!localStream || callType !== 'video') return;

            const videoTracks = localStream.getVideoTracks();
            const videoBtn = document.getElementById('videoBtn');

            if (videoTracks.length > 0) {
                isVideoOff = !isVideoOff;
                videoTracks[0].enabled = !isVideoOff;
                
                if (isVideoOff) {
                    videoBtn.textContent = '📵';
                    videoBtn.classList.add('active');
                } else {
                    videoBtn.textContent = '📹';
                    videoBtn.classList.remove('active');
                }
            }
        }

        // إنهاء المكالمة
        async function endCall() {
            try {
                // إيقاف جميع المسارات
                if (localStream) {
                    localStream.getTracks().forEach(track => track.stop());
                }

                // إغلاق peer connection
                if (peerConnection) {
                    peerConnection.close();
                    peerConnection = null;
                }

                // حذف الغرفة من Firebase إذا كان المنشئ
                if (isCreator && currentRoomId) {
                    await db.collection('rooms').doc(currentRoomId).delete();
                }

                // إعادة تعيين المتغيرات
                currentRoomId = null;
                localStream = null;
                remoteStream = null;
                isMuted = false;
                isVideoOff = false;
                isCreator = false;

                // مسح مصادر الفيديو
                const localVideo = document.getElementById('localVideo');
                const remoteVideo = document.getElementById('remoteVideo');
                if (localVideo) localVideo.srcObject = null;
                if (remoteVideo) remoteVideo.srcObject = null;

                // العودة للشاشة الرئيسية
                showHome();

            } catch (error) {
                console.error('خطأ في إنهاء المكالمة:', error);
                showHome();
            }
        }

        // التحقق من دعم المتصفح
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            showError('متصفحك لا يدعم المكالمات الصوتية والمرئية');
        }

        // طلب الأذونات وتحميل الأجهزة عند تحميل الصفحة
        window.addEventListener('load', async () => {
            try {
                // طلب الأذونات أولاً
                await navigator.mediaDevices.getUserMedia({ audio: true, video: true });
                // تحميل قائمة الأجهزة
                await loadDevices();
            } catch (error) {
                console.log('لم يتم منح الأذونات بعد');
            }
        });

        // تنظيف الموارد عند إغلاق الصفحة
        window.addEventListener('beforeunload', () => {
            endCall();
        });

        // تحديث قائمة الأجهزة عند تغيير الأجهزة
        navigator.mediaDevices.addEventListener('devicechange', loadDevices);
    </script>
</body>
</html>
